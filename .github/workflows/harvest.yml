name: Auto Harvest Turnstile Tokens 24/7

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: npm install puppeteer node-fetch@2
      - name: Run Harvester
        run: node scripts/harvest_cloud.js
